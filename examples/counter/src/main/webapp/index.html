<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DejaView — Counter</title>
    <style>
        :root {
            color-scheme: light dark;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #0f1117;
            color: #f5f7fb;
        }

        .counter {
            width: min(28rem, calc(100vw - 3rem));
            padding: 2.5rem;
            border: 1px solid #2a2f3a;
            border-radius: 1rem;
            background: #171a22;
            box-shadow: 0 1.5rem 4rem rgb(0 0 0 / 35%);
        }

        .counter h1 {
            margin: 0 0 1.5rem;
            font-size: 1.75rem;
            letter-spacing: -0.03em;
        }

        .counter p {
            margin: 0 0 1rem;
            font-size: 1.125rem;
        }

        .counter button {
            padding: 0.7rem 1.1rem;
            border: 0;
            border-radius: 0.55rem;
            background: #6d5efc;
            color: #fff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        .counter button:hover {
            background: #8274ff;
        }

        .counter .tagline {
            margin-top: 1.5rem;
            color: #9aa3b2;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
<main id="app"></main>
<noscript>DejaView requires JavaScript to run.</noscript>
<script src="app.js"></script>
<script>main();</script>
</body>
</html>
