<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>DejaView Showcase</title>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
<script>
    // Run the example selected via the ?example= query parameter.
    // The default is "counter".
    if (typeof io !== "undefined" &&
        typeof io.dejaview !== "undefined" &&
        typeof io.dejaview.examples !== "undefined") {
        io.dejaview.examples.showcase.ShowcaseApp.main();
    }
</script>
</body>
</html>
